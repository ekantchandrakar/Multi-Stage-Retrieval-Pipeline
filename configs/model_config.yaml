# model_config.yaml  –  Model Configuration
# ==========================================

# Bi-Encoder (semantic retrieval)
bi_encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu" # "cuda" for GPU
  batch_size: 128 # larger is faster if RAM allows
  max_seq_length: 256
  normalize_embeddings: true
  embedding_dim: 384
  pooling_mode: "mean"

# Cross-Encoder (re-ranking)
cross_encoder:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  device: "cpu"
  batch_size: 32
  max_seq_length: 512
  show_progress_bar: false

# ──────────────────────────────────────────
#  FAISS index configuration  (Feature 3)
# ──────────────────────────────────────────
faiss:
  # index_type options:
  #   null  → auto-select (Flat < 10K, IVFFlat < 500K, IVFPQ ≥ 500K)
  #   flat  → IndexFlatIP  (exact, small corpora)
  #   ivf   → IndexIVFFlat (approximate, good accuracy, medium corpora)
  #   ivfpq → IndexIVFPQ   (compressed, very large corpora)
  index_type: null # null = auto

  # IVF tuning  (null = auto-compute from corpus size)
  nlist: null # number of Voronoi cells  ≈ sqrt(N)
  nprobe: null # cells searched per query ≈ nlist * 0.05

  normalize_vectors: true
  metric: "inner_product" # inner_product | l2

# BM25 tuning
bm25:
  k1: 1.5
  b: 0.75
  epsilon: 0.25
  lowercase: true
  remove_stopwords: false
  stemming: false

# General
general:
  random_seed: 42
  verbose: true
  cache_dir: "./models/cache/"
  use_multiprocessing: false
  num_workers: 4
