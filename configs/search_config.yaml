# search_config.yaml
# ==================

# ── Dataset  ────────────────────────────────────────────────────────────────
dataset:
  source: "staqc" # "staqc"  OR  path/to/legacy.csv

  # Valid StaQC config names (must match HuggingFace exactly):
  #   man_python  – manually curated Python  (~148 K records)
  #   man_sql     – manually curated SQL     (~120 K records)
  #   mca_python  – multi-code-answer Python (~60 K records)
  #
  # Convenience aliases also accepted: "python" → man_python, "sql" → man_sql
  language: "man_python"

  max_records: 20000 # 0 = no cap; use 2000 to replicate old behaviour
  cache_dir: "models/data_cache"

# ── BM25 ────────────────────────────────────────────────────────────────────
bm25_search:
  top_k: 50
  min_score: 0.0

# ── Semantic ────────────────────────────────────────────────────────────────
semantic_search:
  top_k: 50
  similarity_metric: "cosine"
  min_similarity: 0.0

# ── RRF Fusion ──────────────────────────────────────────────────────────────
rrf_fusion:
  k: 60
  top_k: 50
  use_weights: false
  bm25_weight: 0.5
  semantic_weight: 0.5

# ── Cross-encoder re-ranking ─────────────────────────────────────────────────
cross_encoder_rerank:
  top_k: 5
  batch_size: 32
  min_score: null

# ── Query processing ─────────────────────────────────────────────────────────
query_processing:
  lowercase: true
  strip_whitespace: true
  remove_special_chars: false
  max_query_length: 512

# ── Search modes ─────────────────────────────────────────────────────────────
search_modes:
  default: "hybrid"
  bm25_only:
    top_k: 5
  semantic_only:
    top_k: 5
  hybrid:
    retrieve_k: 50
    rerank_k: 5

# ── Caching ──────────────────────────────────────────────────────────────────
caching:
  enable_query_cache: true
  cache_size: 1000
  cache_ttl: 3600

# ── Evaluation (NDCG / MRR / Recall) ─────────────────────────────────────────
evaluation:
  k: 10
  search_types:
    - bm25
    - semantic
    - hybrid
  ground_truth:
    strategy: "keyword_match"
    min_relevance: 2
  test_queries:
    - "reverse a linked list in Python"
    - "implement binary search tree in Python"
    - "Adding a simple value to a string"
    - "how to use list comprehension in Python"
    - "How can I sort a 2D list?"
    - In Python, can I call the variable from main function - use global variable?

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  log_queries: true
  log_results: false
  log_level: "INFO"

# ── Performance ───────────────────────────────────────────────────────────────
performance:
  enable_parallel_search: false
  num_threads: 4
